[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wcd_vae"
description = "Wasserstein Critic Deconfounding Variational Autoencoder"
authors = [{ name = "Kendall Reid", email = "kreid415@protonmail.com" }]
readme = "README.rst"
version = "1.0.0"
dependencies = []
requires-python = ">= 3.11"

[tool.mypy]
ignore_missing_imports = true
strict = true
# TODO: Remove this when explicit-override is enabled by default in strict mode
#   https://github.com/python/mypy/issues/17511
enable_error_code = ["explicit-override"]
# If certain strict config options are too pedantic for a project,
# disable them selectively here by setting to false.
exclude = ["tests", "doc"]

[tool.ruff]
line-length = 99
target-version = "py38"
src = ["src"]
# Ruff will automatically exclude all files listed in .gitignore as well as common temporary Python
# tool directories.
# To exclude additional folders, use extend-exclude.
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "RUF", # ruff
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "PTH", # flake8-use-pathlib
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
# TODO: Remove ISC001 ignore when formatter updated: https://github.com/astral-sh/ruff/issues/8272
extend-ignore = ["RUF005", "RUF012", "ISC001"]

[tool.ruff.lint.per-file-ignores]
# Experiment scripts: E501 long metric/config lines; PTH os.path usage kept consistent
# with the rest of the project's script layer.
"scripts/*.py" = ["E501", "PTH103", "PTH111", "PTH118", "PTH120", "PTH123"]
# Numerical modules relocated from upstream scCRAFT during the authored-vs-upstream
# refactor. N806: ML tensor naming (X_tensor, X_raw_tensor) is a deliberate convention;
# E501/PTH123: long numerical expressions and open() calls preserved verbatim from the
# working baseline to avoid behavior-altering edits to validated training/eval code.
"src/wcd_vae/wcd/training.py" = ["N806", "E501"]
"src/wcd_vae/wcd/backbones.py" = ["N806", "E501"]
"src/wcd_vae/wcd/evaluation.py" = ["E501", "SIM108"]
# experiment.py: shared harness. E501 long metric-call lines; PTH/SIM115 the same
# devnull-stdout idiom used to silence scib's optimal-resolution clustering.
"src/wcd_vae/wcd/experiment.py" = ["E501", "PTH111", "PTH118", "PTH123", "SIM115"]
# SIM115: sys.stdout is deliberately redirected to os.devnull and restored in a
# finally block to silence scib's chatty cluster_optimal_resolution; a context
# manager would not fit the stdout-swap idiom.
"src/wcd_vae/wcd/hyperparameter.py" = ["E501", "PTH123", "SIM115"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false
# For non-src directory projects, explicitly set top level package names:
# known-first-party = ["my-app"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument"]

[project.optional-dependencies]
test = ["pytest", "pyright", "ruff", "mypy"]
